- name: Produktionsanlage für Volkswagen
  customer: Acozzuol
  period: 2026
  location: Buenos Aires, Argentinien
  bullets:
    - Softwareentwicklung und Inbetriebnahme von zwei automatisierten Fertigungsstationen und einer Dosieranlage
    - Umsetzung der Prozesssteuerung sowie Integration der Anlagenkomponenten in die Produktionslinie einschließlich Traceability
    - Optimierung der Anlagenfunktionen während der Inbetriebnahme
  responsibilities:
    - SPS-Programmierung
    - Inbetriebnahme
    - Fehlersuche
    - Visualisierung
    - Dosiertechnik
    - Datenhandling
