- name: Robotergestützte Fertigungsanlage
  customer: Mubea
  period: 2025
  location: Prag, Tschechien
  bullets:
    - Entwicklung und Inbetriebnahme einer automatisierten Fertigungslösung mit acht Industrierobotern
    - Umsetzung der Prozesssteuerung für Reinigung, Dichtmittelauftrag, Prüfung und Materialhandling
    - Rückverfolgbarkeit (Traceability) von Prozessdaten
  responsibilities:
    - SPS-Programmierung
    - Inbetriebnahme
    - Fehlersuche
    - Visualisierung
    - Robotik
    - Datenhandling
