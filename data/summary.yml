text: >
  Automatisierungsingenieur mit Fokus auf SPS-Programmierung,
  Robotik und die Inbetriebnahme komplexer Produktionsanlagen.

  Ich entwickle und optimiere Automatisierungslösungen mit Siemens
  TIA Portal und WinCC, analysiere Störungen im laufenden Betrieb
  und begleite Inbetriebnahmen bei Kunden im In- und Ausland.

  Ergänzend bringe ich Erfahrung in Schulung,
  technischer Dokumentation und Projekten mit
  Allen-Bradley-Steuerungen mit.
